# Every pull request, and master: the compiler builds and the test suite passes,
# without the valgrind and ThreadSanitizer runs (those are in ci-full.yml).
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/rc2-verify.yml
    with:
      verify-args: --no-valgrind --no-tsan
      timeout-minutes: 90
