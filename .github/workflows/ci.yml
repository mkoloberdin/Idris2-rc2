# Every pull request, and master: the compiler builds and the test suite passes,
# without the valgrind and ThreadSanitizer runs, and rc2 builds the compiler (stage1 of
# selfhost.sh). The rest of the self-hosting checks, valgrind and ThreadSanitizer are in ci-full.yml.
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/rc2-verify.yml
    with:
      verify-args: --no-valgrind --no-tsan
      timeout-minutes: 90

  selfhost:
    uses: ./.github/workflows/rc2-selfhost.yml
    with:
      stage: stage1
      timeout-minutes: 90
